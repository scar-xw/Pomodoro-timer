<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POMODORO TIMER</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; media-src 'self';"
    />
    
    <link rel="stylesheet" href="styles.css" />

  </head>

  <body>
    <div class="outer-app">

      <div id="barButtons">

      <div id="study-break-tag">
        <span id="light" class="break-light"></span>
        <span id="textStudyOrBreak">BREAK</span>
      </div>
        <!-- Min button -->
      <img
        src="assets/-.png"
        width="20"
        height="20"
        class="minimize-button"
        alt="Minimize"
        role="button"
        tabindex="0"
        id="minimizeButtonWindow"
      />
      <!-- Close button -->
      <img
        src="assets/X.png"
        width="20"
        height="20"
        class="close-button"
        alt="Close"
        role="button"
        tabindex="0"
        id="closeButtonWindow"
      />

      </div>

      <!-- Panda image/gif -->
      <div id="panda">
        <img id="pandaAwake"
            src="assets/PandaAwake.png"
            width="140"
            height="125"
        />
              <img id="pandaAwake2"
          src="assets/PandaAwake.png"
          width="140"
          height="120"
      />

        <img id="pandaSleeping1"
            src="assets/PandaSleeping.png"
            width="150"
            height="125"
        />

            <img id="pandaSleeping2"
            src="assets/PandaSleeping.png"
            width="150"
            height="130"
        />

      </div>
      
     <div class="study-session-tag">
        <span id="bottomLight1" class="study-light"></span>
         <span id="bottomLight2" class="study-light"></span>
          <span id="bottomLight3" class="study-light"></span>
      </div>

      <div id="timer-area">
 <!-- Less time button -->
        <img id="lessTimeButton"
            src="assets/-.png"
            width="20"
            height="20"
            role="button"
            tabindex="0"
            alt="Remove 5 minutes"
            />
        <div id="timer-and-background">
          <h2 id="timer" class="timer-font">00:00</h2>
        </div>

           <!-- More time button -->
            <img id="moreTimeButton"
            src="assets/+.png"
            width="20"
            height="20"
            role="button"
            tabindex="0"
            alt="Add 5 minutes"/>
      </div>

        <!-- Start button -->
        <div id="control-buttons">

          <img id="startButton"
          src="assets/START.png"
          width="90"
          height="40"
          alt="Start"
          role="button"
          tabindex="0"
          />



        <!-- Reset Button -->

          <img id="resetButton"
          src="assets/restart.png"
          width="40"
          height="40"
          role="button"
          tabindex="0"
          alt="Reset"
          />


        <!-- Continue Button -->

          <img id="continueButton"
          src="assets/play.png"
          width="40"
          height="40"
          role="button"
          tabindex="0"
          alt="Continue"
          >

           <!-- Stop button -->

          <img id="stopButton"
          src="assets/II.png"
          width="40"
          height="40"
          role="button"
          tabindex="0"
          alt="Pause"
          />

          </div>


      </div> <!--outer app-->


    <script src="script.js" defer></script>
    <script src="renderer.js"></script>
    
  </body>
</html>

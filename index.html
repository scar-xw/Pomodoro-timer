<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> POMODORO TIMER </title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   
    
    <!-- font-->
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap" rel="stylesheet">
  </head>

  <body>
    <div class="outer-app">
    <div class="app">
<!-- Panda image-->
      <div class="panda">
        <img src="C:\Users\becca\Documents\PROJECTS\Pomodoro-timer\assets\PANDA.png" width="130px" height="150px">
      </div>
      <div>
        <h2 id="timer" class="timer-font">00:00</h2>
      </div>
<!-- Buttons for time definition-->
      <div id="timeButtons">
        <fieldset>
            <label for="study"> Study</label>
            <br>
        <select id="study">
          <br>
          <option value="10">10 minutes</option>
          <option value="1200">20 minutes</option>
          <option value="1700"> 25 minutes</option>
          <option value="2000"> 30 minutes</option>
          
        
        </select>
        <br>
        <label for="break"> Break</label>
        <br> 
        <select id="break">
          <option value="300"> 5 minutes</option>
          <option value="600"> 10 minutes</option>
          <option value="900"> 15 minutes</option>
        </select>
        </fieldset>
      </div>

      <!-- Start button-->
      <div>
      
      <button id="startButton" type="button" >START</button>
      </div>
      
      <!-- Stop button-->
      <div class="stop-button">
        <button id="stopButton" type="button">STOP</button>
      </div>

      <!-- Reset Button-->
       <div>
        <button id="resetButton" type="button">RESET</button>
       </div>

       <!--Continue Button-->
       <div>
        <button type="button" id="continueButton">CONTINUE</button>
       </div>
    </div>
    </div>
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  </body>
</html>
